# Model configuration — Healthcare RCM Intelligence Platform
#
# LEAKAGE BLACKLIST (CLAUDE.md §4, NON-NEGOTIABLE).
#
# Source of truth for every entry under `forbidden_*` below is
# docs/simulated_forbidden_columns.md — the §4.5 firewall interface, written by
# simulation-engineer so that ml-engineer never has to open src/simulation/.
# The lists are not hand-curated: each is tagged with the document section it is
# copied from, and src/features/leakage.py parses that document and asserts the
# two agree (tests/leakage/test_forbidden_config_agrees_with_doc.py). Editing
# one without the other fails the build, which is the point.
#
# Structure, and why it is split rather than one flat list:
#   forbidden_features          columns the DOCUMENT names as forbidden for
#                               Model A. This is the doc-agreement surface and
#                               must equal the parsed document exactly.
#   forbidden_tables            §2 whole-table forbids, expressed the way the
#                               document expresses them.
#   forbidden_table_columns     those tables expanded to real column names, so
#                               the training-matrix guard can work on names
#                               alone without a database connection.
#   forbidden_derived_features  DERIVED columns in the analytics views that are
#                               functions of the above. Not in the document —
#                               the document covers the generated schema, these
#                               are sql/views/ columns. CLAUDE.md §4.1 requires
#                               blocking "a column derived from one" too.
#   forbidden_source_features   SOURCE (CMS) columns that are adjudication
#                               outputs and so are not knowable pre-submission.
#   forbidden_features_defensive  names with no matching column today, kept as
#                               tripwires.
# The guard in src/features/leakage.py unions all of them.

seed: 1337

feature_store:
  prior_period:
    # Historical rates look at claims submitted strictly before the row's
    # cutoff. The cutoff is the submission date minus an embargo, because
    # "submitted before t" is not "known before t" — a claim submitted last week
    # has not come back from the payer yet. 60 days is a payer adjudication and
    # posting cycle; it is set from that business rule and deliberately NOT
    # fitted to observed adjudication timing, which would mean designing a
    # feature from a forbidden column.
    embargo_days: 60
    # Model C's prior-period rates are OVERTURN rates, and an appeal outcome is
    # known much later than a denial. Two published Medicare Part A/B
    # redetermination rules bound it: the appeal must be filed within 120 days of
    # the initial determination, and the contractor then has 60 days to issue a
    # decision. 180 days after the denial posts is therefore the worst case for
    # "this outcome is on the books". Derived from the published appeals
    # timetable and deliberately NOT checked against sim_appeal_decision_date,
    # which is forbidden for Model C — fitting the embargo to the observed
    # decision lag would be designing a feature out of a forbidden column, the
    # same error the 60-day figure above is written to avoid.
    appeal_embargo_days: 180
    # m-estimate weight. An entity with this many prior claims is weighted half
    # its own rate, half the book rate. The median provider here has two claims,
    # so most provider rates are almost entirely shrunk — which is the honest
    # treatment of two observations.
    smoothing: 20.0
    entities:
      sim_payer: sim_payer_id
      sim_provider: prvdr_num
      sim_service_line: sim_service_line_id

split:
  strategy: temporal
  # docs/simulated_forbidden_columns.md §8: submission dates span 2015-2024 but
  # the tail years are sparse (2023 ~3.4% of claims), so holding out the final
  # calendar year gives a tiny skewed fold. Quantile cut instead.
  time_column: sim_submission_date
  train_quantile: 0.80
  # Validation fold for calibration is carved out of the TRAIN side, again
  # temporally, so calibration never sees the forward test fold.
  calibration_quantile_of_train: 0.80

# ---------------------------------------------------------------------------
# Model A — pre-submission denial risk. Boundary: the moment before submission.
# ---------------------------------------------------------------------------

# docs/simulated_forbidden_columns.md §1 (latent internals — forbidden in EVERY
# model), §2 (post-submission outcome / money / dates), §4 (workflow-event
# columns named forbidden), §6 (provenance stamps), §7 (warehouse keys).
forbidden_features:
  # §1 — latent generator internals. Answer keys; never a feature, any model.
  - sim_latent_p
  - sim_provider_quality_latent
  - sim_label_noise_applied
  - sim_appeal_latent_p
  # §2 Outcome
  - sim_denial_flag
  - sim_denial_type
  - sim_denial_category
  - sim_denial_carc_group
  - sim_denial_driver_mechanism
  # §2 Money
  - sim_allowed_amount
  - sim_paid_amount
  - sim_patient_responsibility_amount
  - sim_contractual_adjustment_amount
  - sim_denied_amount
  # §2 Dates and durations after submission
  - sim_ack_date
  - sim_adjudication_date
  - sim_denial_review_date
  - sim_payment_date
  - sim_days_to_adjudication
  - sim_days_to_payment
  # §4 — workflow-event columns forbidden as features even after row filtering
  - sim_event_sk
  - sim_appeal_level
  # §6 — provenance stamps present on every generated table
  - sim_provenance
  - sim_config_version
  - sim_seed
  # §7 — warehouse keys (claim_sk is assigned in source-file order and acts as
  # a smuggled date feature)
  - claim_sk
  - clm_id

# §2 "Whole tables" — every column is post-submission for Model A.
forbidden_tables:
  - sim_appeals
  - sim_operating_costs

# The above expanded against the live schema (rcm.*), so the name-based guard
# needs no database. tests/leakage/ re-checks this expansion against
# information_schema when Postgres is available (integration marker).
forbidden_table_columns:
  sim_appeals:
    - sim_appeal_sk
    - sim_appeal_level
    - sim_appeal_filed_date
    - sim_appeal_decision_date
    - sim_appeal_outcome
    - sim_appeal_disputed_amount
    - sim_appeal_recovered_amount
    - sim_appeal_latent_p
  sim_operating_costs:
    - sim_touch_minutes_total
    - sim_coding_cost
    - sim_submission_cost
    - sim_payment_posting_cost
    - sim_denial_rework_cost
    - sim_appeal_cost
    - sim_total_cost_to_collect

# sim_workflow_events is the third whole-table entry in §2, but it is filtered
# by row rather than dropped: events at or before the claim's CLAIM_SUBMITTED
# timestamp are pre-submission facts and are permitted. §4.
workflow_events:
  boundary_event: CLAIM_SUBMITTED
  # Timestamp-based, not event-type-based, so a new event type cannot leak in.
  filter: sim_event_ts <= claim's CLAIM_SUBMITTED sim_event_ts
  forbidden_columns:
    - sim_event_sk
    - sim_appeal_level
  # §4: "The recurring hazard here is aggregation, not selection." Any sum, max
  # or count must be taken over the filtered rows only — sim_event_seq and
  # sim_touch_minutes encode rework effort, and therefore the label, when
  # aggregated over a claim's full history.
  aggregate_after_filter_only:
    - sim_event_seq
    - sim_touch_minutes

# DERIVED columns of sql/views/ (not generated columns, so outside the scope of
# the firewall document) that are functions of forbidden columns. CLAUDE.md §4.1
# requires blocking derived columns too. Value = what it is derived from.
#
# HOW THESE ARE MATCHED, because it decides what an entry here has to say.
# src/features/leakage.py `_offenders` matches EXACT first, then SUBSTRING — a
# forbidden column wearing a hat. So an entry keeps blocking a column that is
# later renamed to a SUPERSTRING of it: `dollars_at_stake` still blocks
# `sim_dollars_at_stake`. MEASURED, not assumed. It does NOT survive a rename
# that changes a word — `sim_amount_at_stake` is not blocked by anything here —
# so a view rename still has to land in lockstep with this block. The names are
# also resolved by FNMATCH in the test suite; a glob written here would pass the
# dead-pattern test and block nothing at runtime, so do not write one.
forbidden_derived_features:
  sim_adjudicated: derived from sim_adjudication_date
  sim_clean_claim_flag: derived from sim_denial_flag and first-pass payment
  sim_first_pass_paid_flag: derived from sim_denial_flag and sim_paid_amount
  sim_ar_open_flag: derived from sim_payment_date
  sim_ar_balance_amt: derived from sim_allowed_amount and sim_paid_amount
  sim_heuristic_priority_score: vw_work_queue_priority, built on sim_denial_flag
  sim_priority_tier: vw_work_queue_priority, an ntile over sim_heuristic_priority_score; the score is derived from simulated money
  sim_dollars_at_stake: vw_work_queue_priority, built on sim_denied_amount
  # Added 2026-07-29 (ml-engineer-7). It was missing, and nothing else here was a
  # substring of it, so it was blocked by nothing: vw_work_queue_priority:78-82
  # builds it as a CASE on sim_denial_flag, which encodes the LABEL directly. It
  # is a stronger leak than two entries that were already on this list.
  sim_action_type: vw_work_queue_priority, a CASE on sim_denial_flag; encodes the label
  sim_appeal_levels: count over sim_appeals; non-zero implies a denial

# vw_work_queue_priority.sim_age_days is DELIBERATELY NOT on the list above, recorded
# here because an unexplained omission from a blacklist reads as an oversight.
# It is `as_of_date - sim_submission_date`: a monotone function of the
# point-in-time boundary plus one global constant. sim_submission_date is the
# boundary itself and is permitted, and features derived from it are live and
# legitimate (sim_days_service_to_submission, sim_filing_headroom_days,
# sim_submission_month). Blocking sim_age_days would bar a column that is
# informationally identical to columns Model A already uses. What is
# label-bearing about that view is MEMBERSHIP in it — the where clause selects
# denied-or-open-AR claims — and membership is not a column, so no blacklist
# entry can express it. Never build a Model A feature from a filtered view.

# SOURCE columns from the CMS claim that are adjudication OUTPUTS. They are real
# rather than simulated, so the firewall document does not cover them, but a
# biller does not know any of them at the moment before submission — the same
# test CLAUDE.md §4 applies to the simulated layer. billed_charge_amt (what is
# billed) is permitted; what Medicare decided to pay is not.
forbidden_source_features:
  medicare_source_paid_amt: CMS clm_pmt_amt — the payer's payment decision
  clm_pmt_amt: same column, star-schema name
  ncvrd_charge_amt: non-covered charge is an adjudication determination
  nch_ip_ncvrd_chrg_amt: same column, star-schema name
  bene_deductible_amt: deductible applied is an adjudication determination
  nch_bene_ip_ddctbl_amt: same column, star-schema name
  # Measured 2026-07-27 before classifying, because a covered-day count that is
  # only ever a fixed offset from the calendar stay would carry no information
  # and the call would be moot. It is not a fixed offset. length_of_stay_days is
  # (discharge - admission) + 1 on 100% of 20,867 claims — pure calendar
  # arithmetic, knowable at submission. clm_utlztn_day_cnt equals
  # (discharge - admission) on 92.5% and is one day SHORT of it on the other
  # 7.53% (1,572 claims), and that deficit cohort carries 7.2x the mean
  # non-covered charge ($2,784 vs $385) and a higher rate of any non-covered
  # charge at all (47.2% vs 37.9%). The short day is therefore a benefit
  # determination — a day the payer did not count as covered — which is the same
  # adjudication event nch_ip_ncvrd_chrg_amt above records in dollars.
  # length_of_stay_days stays PERMITTED; it is the calendar stay, not the
  # covered stay.
  clm_utlztn_day_cnt: covered/utilization days is a benefit determination

# Names CLAUDE.md §4 or an older config called out that match no column in the
# schema today. Kept so a future rename cannot reintroduce them silently.
forbidden_features_defensive:
  - sim_denial_reason

# Simulated display-only linkage (CLAUDE.md §3.4). These tables map synthetic
# provider identifiers onto real facilities and NPIs by seeded random
# assignment, purely so the dashboard has recognisable names. The assignment
# carries no information about the claim, and it multiplexes 4,876 synthetic
# providers onto 2,857 real CCNs (worst case 8:1), so a real CCN is not even a
# stable entity key. Whole tables are excluded from the feature store; facility
# and provider analysis keys on the synthetic prvdr_num. The document does not
# cover these tables — they are data-engineer's, classified in
# docs/provenance_register.md — so they are classified here.
forbidden_crosswalk_tables:
  - sim_facility_crosswalk
  - sim_provider_crosswalk

# Those tables' columns by name, plus the same linkage as it surfaces in
# sql/views/. Both the pre- and post-rename spellings of the view columns are
# listed, so the in-flight sim_ prefix change cannot open a window in either
# direction. Note the synthetic `prvdr_num` is deliberately NOT here: it is the
# legitimate provider key and the correct grouping key for facility analysis.
forbidden_crosswalk_display_features:
  # as they appear in the crosswalk tables
  - sim_prvdr_num
  - sim_provider_ssa_state
  - sim_provider_postal_state
  - sim_at_physn_npi
  - assigned_postal_state
  - real_npi
  - real_provider_state
  - real_specialty
  - match_rule
  - same_state
  - crosswalk_seed
  # as they appear in the views, post-rename and pre-rename
  - sim_facility_ccn
  - sim_facility_name
  - sim_facility_state
  - sim_facility_type
  - facility_ccn
  - facility_name
  - facility_state
  - facility_type
  - display_facility_ccn
  - display_facility_name
  - display_facility_state

# ---------------------------------------------------------------------------
# Model C — appeal success. Boundary: the denial has been posted and is being
# triaged, so post-denial facts are legitimately available.
# docs/simulated_forbidden_columns.md §5.
# ---------------------------------------------------------------------------
model_c:
  boundary: denial_posted
  targets:
    classification: sim_appeal_outcome
    regression: sim_appeal_recovered_amount
  # Relative to Model A: these become available, because a denials analyst is
  # looking at them at triage time.
  permitted_beyond_model_a:
    - sim_denial_flag
    - sim_denial_type
    - sim_denial_category
    - sim_denial_carc_group
    - sim_allowed_amount
    - sim_paid_amount
    - sim_patient_responsibility_amount
    - sim_contractual_adjustment_amount
    - sim_denied_amount
    - sim_ack_date
    - sim_adjudication_date
    - sim_denial_review_date
    - sim_days_to_adjudication
  # Still forbidden: §1 in full, plus every sim_appeals column other than the
  # targets — filed/decision dates, the disputed amount and the level-2 rows all
  # postdate the decision being predicted.
  forbidden_features:
    - sim_latent_p
    - sim_provider_quality_latent
    - sim_label_noise_applied
    - sim_appeal_latent_p
    # sim_denial_driver_mechanism stays out: it is the generator's statement of
    # WHY the denial happened, not something on the remittance advice.
    - sim_denial_driver_mechanism
    - sim_appeal_sk
    - sim_appeal_level
    - sim_appeal_filed_date
    - sim_appeal_decision_date
    - sim_appeal_disputed_amount
    - sim_appeal_recovered_amount
    - sim_appeal_outcome
    - sim_payment_date
    - sim_days_to_payment
    - sim_provenance
    - sim_config_version
    - sim_seed
    - claim_sk
    - clm_id

# ---------------------------------------------------------------------------
# Estimators. Fixed, declared, and deliberately NOT searched.
#
# No hyperparameter search is run anywhere in this project, and that is a
# decision rather than an omission. The label carries deliberate noise with an
# oracle ceiling near ROC-AUC 0.68 (sanity_bounds below), the forward test fold
# is ~4,200 claims holding ~500 denials, and a search over that surface would be
# selecting on differences smaller than the bootstrap interval — it would buy a
# better number and a worse model. The values below are ordinary regularized
# defaults: shallow trees, strong minimum child weight, subsampling, and an L2
# penalty on the linear model.
# ---------------------------------------------------------------------------
estimators:
  logistic:
    # Regularized, unweighted. class_weight="balanced" would improve nothing that
    # matters here — ranking is unchanged by a constant reweighting and the
    # probabilities go through isotonic afterwards anyway — while making the
    # uncalibrated Brier score meaningless.
    C: 1.0
    max_iter: 2000
    solver: lbfgs
  xgboost:
    n_estimators: 300
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    # ~1.5% of the fit fold. Leaves that thin cannot form on 500-ish positives
    # without memorising individual claims.
    min_child_weight: 20.0
    reg_lambda: 2.0
    n_jobs: 4

# ---------------------------------------------------------------------------
# Decision thresholds and economics
# ---------------------------------------------------------------------------
# The value of catching a denial before it happens is NOT the claim. The first
# version of this block asserted that it was (`prevented_denial_value_multiplier:
# 1.0`), and that single number quietly made two separate claims at once: that a
# review prevents the denial WITH CERTAINTY, and that a denial costs the FULL
# claim value. Both are wrong, the second badly so — denials are appealed and
# substantially overturned, so the real loss is the unrecovered fraction plus
# rework, not the claim.
#
# So it is decomposed into two named factors, each set from PUBLISHED benchmarks
# and each labelled DESIGN CHOICE in the sense docs/assumptions.md uses: a
# defensible number nobody has measured on THIS book, stated so it can be argued
# with rather than buried in a product.
#
#   prevented_denial_value_multiplier
#     = p_prevented_given_flagged_and_worked x share_of_claim_value_permanently_lost
#
# NEITHER FACTOR IS DERIVED FROM THE SIMULATION. The generator's realized
# overturn and rework rates are behind the CLAUDE.md §4.5 firewall, and reading
# them to set a business parameter would make the operating point a function of
# exactly what the firewall exists to hide. Published sources only, and the
# factors were fixed BEFORE the resulting threshold was computed — a cost matrix
# reverse-engineered from a pleasing flagged share is the same failure as tuning
# a model to beat a baseline.
cost_matrix:
  # MGMA benchmarks the administrative labour to rework a single denied claim at
  # roughly $25-$118. $25 is the low end of that range and is the right end for
  # a PRE-submission review, which is a scrub-and-fix on an open claim rather
  # than a denial workup.
  review_cost_usd: 25

  # FACTOR 1 — P(the denial is actually prevented | the claim was flagged and a
  # reviewer worked it). Change Healthcare's Denials Index puts 86% of denials in
  # the "potentially avoidable" bucket, which is a ceiling on what any pre-bill
  # intervention could ever reach, and reports that about HALF of denials arise
  # from front-end causes — registration/eligibility (the largest single cause,
  # near 27%), authorization, and service-not-covered. Those are the causes a
  # pre-submission review can see and act on; a medical-necessity or bundling
  # determination made downstream by the payer is largely not.
  # 0.50 therefore reads as "the front-end share", and it is the OPTIMISTIC end
  # of honest: it equates 'this denial had a front-end cause' with 'this review
  # caught it and fixed it in time', which will not be true of every claim.
  p_prevented_given_flagged_and_worked: 0.50

  # FACTOR 2 — the share of a denied claim's value PERMANENTLY lost. The same
  # Denials Index reports that of the potentially-avoidable denials, about 24%
  # are not recoverable; the rest are ultimately reworked or appealed into
  # payment. Premier Inc.'s 2024 survey points the same way, with a majority of
  # contested denials ultimately overturned and paid.
  # 0.25 is a FLOOR on the true loss, and deliberately so: it describes a billing
  # office that actually works its denial queue. MGMA and Change Healthcare both
  # report that 50-65% of denied claims are never reworked at all, and in a shop
  # like that the permanently-lost share is far higher. Taking the floor keeps
  # the threshold from being flattered by an assumption of institutional neglect.
  share_of_claim_value_permanently_lost: 0.25

  # Product: 0.50 x 0.25 = 0.125. Recorded here for readability only —
  # src/models/evaluate.py computes it from the factors, so editing this line
  # changes nothing and a test asserts the two agree.
  prevented_denial_value_multiplier_derived: 0.125

  false_negative_penalty: unrecovered_share_of_expected_reimbursement

# WHAT FALLS OUT OF THOSE FACTORS, reported because the ruling was to report it
# whatever it said. The cost-optimal threshold is STILL degenerate: it flags
# essentially the whole queue.
#
# The reason is arithmetic and worth stating, because it is a finding about this
# problem rather than about this model. A claim is worth reviewing when
#   multiplier x P(denial) x dollars_at_stake  >  review_cost
# MEASURED, not asserted — src/models/evaluate.py: break_even_multiplier(), and
# the run records it in metrics.json. On the CALIBRATION fold (the fold the
# threshold is chosen on) the denial rate is 0.1306 and the mean denied amount is
# $3,029.75, so the BREAK-EVEN multiplier is 0.0632. The same figure is 0.0543 on
# the test fold and 0.0785 across the whole book: near 0.05-0.08 however it is
# measured. Every honest reading of the published benchmarks lands above that —
# the old 1.0 by a factor of sixteen, the decomposed 0.125 by about two. A
# pre-submission review would have to be under ~6% effective at recovering value
# before the threshold started to bind.
#
# So the degeneracy was never the bad constant. At a $25 review cost against
# thousands of dollars of exposure, reviewing everything really is worth it, and
# the binding constraint is REVIEWER CAPACITY, not economics. That is why the
# capacity-constrained point is the PRIMARY reported operating point: a work
# queue is ranked against finite analyst hours, not thresholded.
#
# The sensitivity sweep stays a first-class artifact regardless. A business
# parameter nobody has measured on this book is a guess, and the sweep is the
# honest way to show a guess. The break-even 0.055 sits inside its range on
# purpose, so the reader can see where the threshold would start to carry
# information and how far the benchmarks are from it.
operating_point:
  review_capacity_share: 0.10
  multiplier_sensitivity: [0.005, 0.01, 0.025, 0.055, 0.075, 0.125, 0.25, 0.5, 1.0]

# ---------------------------------------------------------------------------
# Model C economics and the work-queue rules.
#
# Expected Net Recovery = P(overturn) x recoverable - processing cost.
#
# Note what the processing cost does and does not do. It is a constant
# subtracted from every claim, so it does NOT change the ORDER of the queue —
# ranking by ENR and ranking by P(overturn) x recoverable give the same list.
# What it sets is the cutoff: which claims clear zero and are worth working at
# all. So the number below is load-bearing for the go/no-go decision and
# irrelevant to the ordering, and the model card says so rather than implying
# the whole ranking rests on it.
# ---------------------------------------------------------------------------
appeal_economics:
  # docs/assumptions.md §9 anchors the cost to rework a denied claim at roughly
  # $25-$120, citing MGMA (~$25/appealed claim) at the low end and Premier's 2024
  # ~$44 per contested claim above it. $45 is the Premier-anchored figure for
  # preparing an APPEAL specifically. sim_operating_costs is a forbidden table
  # for both models, so this is an assumption from published benchmarks and
  # nothing else.
  #
  # NO GENERATOR CROSS-CHECK BELONGS HERE. A previous version of this comment
  # reconciled $45 against the simulation's own realized cost per denied claim.
  # It was offered as a consistency remark rather than a derivation, which is
  # exactly the argument the §4.5 firewall rejects: once a generator-realized
  # value is written next to a parameter, a later reader cannot tell whether the
  # parameter was chosen from the citation or nudged toward the number beside it,
  # and neither can the person who edits it next.
  appeal_processing_cost_usd: 45.0

  # Medicare Part A/B redetermination: an appeal must be filed within 120 days of
  # receiving the initial determination. Used to derive days-to-deadline for the
  # urgency rule. Taken from the published timetable and from nothing else — the
  # previous comment here validated this window against the simulated appeals in
  # this warehouse, which is worse than the cost anchor above rather than milder:
  # checking a POLICY PARAMETER against the generated layer is precisely the
  # dependency §4.5 exists to prevent, whatever the observed agreement was.
  filing_window_days: 120
  # Inside this many days of the deadline a claim is worked regardless of score.
  deadline_critical_days: 14

  # Categories a human reviews regardless of expected value. These are a stated
  # PROJECT POLICY, not a claim about regulation: writing off a coverage or
  # coordination-of-benefits denial without review can shift balance onto the
  # beneficiary, and a medical-necessity denial is a clinical determination that
  # a dollar threshold should not silently close. They are configured rather
  # than hardcoded so the policy can be argued with.
  mandatory_review_categories:
    - MEDICAL_NECESSITY
    - ELIGIBILITY_COVERAGE
    - COORDINATION_BENEFITS

  # Work-queue evaluation: the share of the denial queue a team can work.
  queue_capacity_share: 0.10

calibration: isotonic

# Honesty tripwire (CLAUDE.md §1, docs/simulated_forbidden_columns.md §8). The
# label carries deliberate noise; scoring with the true latent probability tops
# out near AUC 0.68 and roughly a third of denials carry no mechanism signal.
# A model above this bound is a leak to hunt, not a result to report.
sanity_bounds:
  oracle_roc_auc: 0.68
  suspicious_roc_auc: 0.75
  suspicious_pr_auc: 0.95
